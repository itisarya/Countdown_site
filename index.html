<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Until We Finally Meet ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
font-family:'Poppins',sans-serif;
background:linear-gradient(to bottom,#fff7f7,#ffe4e8);
display:flex;
justify-content:center;
align-items:center;
position:relative;
color:#c70039;
}

/* Floating Hearts */

.hearts span{
position:absolute;
bottom:-50px;
animation:float linear infinite;
opacity:0.7;
pointer-events:none;
}

@keyframes float{
0%{
transform:translateY(0) scale(0);
opacity:0;
}
10%{
opacity:.8;
}
100%{
transform:translateY(-120vh) scale(1);
opacity:0;
}
}

/* Sparkles */

.sparkle{
position:absolute;
width:4px;
height:4px;
background:white;
border-radius:50%;
box-shadow:0 0 10px white;
animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
from{opacity:.2;}
to{opacity:1;}
}

/* Main Container */

.container{
width:100%;
max-width:430px;
height:100vh;
padding:28px 22px;
display:flex;
flex-direction:column;
align-items:center;
position:relative;
overflow:hidden;
}

/* Title */

.title{
margin-top:50px;
text-align:center;
}

.title h1{
font-family:'Sacramento',cursive;
font-size:3.5rem;
line-height:1.05;
font-weight:400;
color:#d1002c;
}

.title p{
margin-top:10px;
font-size:.95rem;
opacity:.7;
}

/* Countdown Card */

.countdown-card{
margin-top:40px;
width:100%;
background:rgba(255,255,255,.45);
backdrop-filter:blur(14px);
border-radius:30px;
padding:25px;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:
0 10px 40px rgba(255,0,60,.08);
}

.time-box{
text-align:center;
}

.time-box h2{
font-size:3rem;
font-weight:600;
color:#d1002c;
}

.time-box span{
font-size:1rem;
letter-spacing:2px;
}

/* Progress Section */

.progress-section{
margin-top:70px;
width:100%;
position:relative;
}

/* Characters */

.characters{
position:relative;
height:70px;
width:100%;
margin-bottom:15px;
}

.character{
position:absolute;
font-size:58px;
transition:all 1s ease;
z-index:5;
}

.boy{
left:0%;
bottom:0;
}

.girl{
right:0;
bottom:0;
}

/* Track */

.track{
width:100%;
height:14px;
background:#ffd8df;
border-radius:50px;
overflow:hidden;
position:relative;
box-shadow:
inset 0 2px 6px rgba(0,0,0,.05);
}

/* Progress Fill */

.progress{
height:100%;
width:0%;
border-radius:50px;
background:
linear-gradient(
90deg,
#ff0037,
#ff8ba5
);
box-shadow:
0 0 15px rgba(255,0,55,.4);
transition:width 1s linear;
}

/* Heart */

.heart-marker{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:22px;
filter:drop-shadow(0 0 8px rgba(255,0,60,.4));
}

/* Progress Text */

.progress-info{
margin-top:24px;
text-align:center;
}

.progress-info h3{
font-size:2rem;
font-weight:600;
color:#d1002c;
}

.progress-info p{
font-size:.95rem;
opacity:.75;
margin-top:5px;
}

/* Final Message */

.final-message{
display:none;
margin-top:55px;
text-align:center;
animation:fadeIn 2s ease;
}

.final-message .hug{
font-size:95px;
animation:bounce 1.5s infinite;
}

.final-message h2{
font-size:2rem;
margin-top:10px;
color:#d1002c;
}

.final-message p{
margin-top:8px;
font-size:1rem;
opacity:.8;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes bounce{
0%{transform:scale(1);}
50%{transform:scale(1.08);}
100%{transform:scale(1);}
}

/* Confetti */

.confetti{
position:absolute;
width:10px;
height:10px;
top:-10px;
animation:fall linear forwards;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(720deg);
opacity:0;
}
}

</style>
</head>

<body>

<!-- Floating Hearts -->
<div class="hearts"></div>

<!-- Sparkles -->
<div class="sparkles"></div>

<div class="container">

<div class="title">
<h1>Until we<br>finally meet ❤️</h1>
<p>20 June 2026 • India</p>
</div>

<div class="countdown-card">

<div class="time-box">
<h2 id="days">0</h2>
<span>DAYS</span>
</div>

<div class="time-box">
<h2 id="hours">0</h2>
<span>HOURS</span>
</div>

</div>

<div class="progress-section">

<div class="characters">

<div class="character boy" id="boy">
👦🏻
</div>

<div class="character girl">
👧🏻
</div>

</div>

<div class="track">

<div class="progress" id="progress"></div>

<div class="heart-marker">
❤️
</div>

</div>

<div class="progress-info">

<h3 id="progressPercent">
0%
</h3>

<p>
of our journey completed
</p>

</div>

</div>

<div class="final-message" id="finalMessage">

<div class="hug">
🫂
</div>

<h2>We Finally Met ❤️</h2>

<p>
And every second was worth it.
</p>

</div>

</div>

<script>

/* Countdown */

const targetDate =
new Date("2026-06-20T00:00:00+05:30").getTime();

const startDate =
new Date().getTime();

const totalDuration =
targetDate - startDate;

const daysEl =
document.getElementById("days");

const hoursEl =
document.getElementById("hours");

const progressEl =
document.getElementById("progress");

const boyEl =
document.getElementById("boy");

const percentEl =
document.getElementById("progressPercent");

const finalMessage =
document.getElementById("finalMessage");

function updateCountdown(){

const now =
new Date().getTime();

const distance =
targetDate - now;

if(distance <= 0){

daysEl.innerHTML = "0";
hoursEl.innerHTML = "0";

document.querySelector(
".progress-section"
).style.display = "none";

finalMessage.style.display = "block";

launchConfetti();

return;
}

const days =
Math.floor(
distance / (1000*60*60*24)
);

const hours =
Math.floor(
(distance % (1000*60*60*24))
/
(1000*60*60)
);

daysEl.innerHTML = days;
hoursEl.innerHTML = hours;

const progressPercent =
((totalDuration - distance)
/
totalDuration) * 100;

progressEl.style.width =
progressPercent + "%";

boyEl.style.left =
`calc(${progressPercent}% - 30px)`;

percentEl.innerHTML =
progressPercent.toFixed(1) + "%";

}

setInterval(updateCountdown,1000);

updateCountdown();

/* Floating Hearts */

const heartsContainer =
document.querySelector(".hearts");

function createHeart(){

const heart =
document.createElement("span");

heart.innerHTML = "❤️";

heart.style.left =
Math.random()*100 + "vw";

heart.style.fontSize =
(Math.random()*18 + 10) + "px";

heart.style.animationDuration =
(Math.random()*5 + 7) + "s";

heartsContainer.appendChild(heart);

setTimeout(()=>{
heart.remove();
},12000);

}

setInterval(createHeart,700);

/* Sparkles */

const sparkles =
document.querySelector(".sparkles");

for(let i=0;i<40;i++){

const s =
document.createElement("div");

s.classList.add("sparkle");

s.style.left =
Math.random()*100 + "vw";

s.style.top =
Math.random()*100 + "vh";

s.style.animationDelay =
Math.random()*3 + "s";

sparkles.appendChild(s);

}

/* Confetti */

function launchConfetti(){

for(let i=0;i<120;i++){

const confetti =
document.createElement("div");

confetti.classList.add("confetti");

confetti.style.left =
Math.random()*100 + "vw";

confetti.style.background =
Math.random() > .5
? "#ff0037"
: "#ff9db0";

confetti.style.animationDuration =
(Math.random()*3 + 2) + "s";

document.body.appendChild(confetti);

setTimeout(()=>{
confetti.remove();
},5000);

}

}

</script>

</body>
</html>
